# Bouwt de website en zet hem online via GitHub Pages,
# elke keer als er iets verandert (ook via Pages CMS).
name: Website publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Geeft het juiste adres: /repo-naam op github.io, of leeg bij een eigen domein
      - id: pages
        uses: actions/configure-pages@v6
      - uses: withastro/action@v6
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Configuratie voor Pages CMS (https://app.pagescms.org)
# Hiermee kan de website zonder programmeerkennis bewerkt worden.

media:
  input: public/media
  output: /media

content:
  # ---------------------------------------------------------------
  - name: nieuws
    label: "📰 Nieuwsberichten 🇳🇱"
    type: collection
    path: src/content/nieuws
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, concept]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: &velden_nieuws
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        description: Berichten worden op datum gesorteerd, de nieuwste staat bovenaan.
      - name: cover
        label: Omslagfoto
        type: image
        description: Grote foto bovenaan het bericht en op de nieuwskaart. Mag leeg blijven.
        options:
          path: nieuws
      - name: samenvatting
        label: Korte samenvatting
        type: text
        description: Eén of twee zinnen voor op de nieuwskaart. Laat je dit leeg, dan wordt het begin van je bericht gebruikt.
      - name: concept
        label: Concept (nog niet publiceren)
        type: boolean
        description: Zet dit aan als je nog niet klaar bent. Het bericht is dan niet zichtbaar op de website.
      - name: body
        label: Bericht
        type: rich-text
        options:
          format: html
          path: nieuws

  # ---------------------------------------------------------------
  - name: news
    label: "📰 News (Engelse berichten) 🇬🇧"
    type: collection
    path: src/content/news
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, concept]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: *velden_nieuws

  # ---------------------------------------------------------------
  - name: site
    label: 💶 Sponsorteller & instellingen (beide talen)
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: opgehaald
        label: Al opgehaald (€)
        type: number
        description: Pas dit aan als er geld binnenkomt. Het bootje in de voortgangsbalk vaart dan verder!
      - name: doelbedrag
        label: Doelbedrag (€)
        type: number
        description: Zet op 0 om de voortgangsbalk te verbergen.
      - name: vertrekdatum
        label: Vertrek (datum en tijd)
        type: date
        default: ""
        description: "Hier telt de klok op de homepagina naartoe. Nederlandse tijd. Tijdens de reis staat er 'Dag 12 op zee'."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: terugkomstdatum
        label: Terugkomstdatum (optioneel)
        type: date
        default: ""
        description: Na deze dag staat er 'Weer veilig thuis!' in plaats van 'Dag … op zee'. Laat leeg zolang de datum niet bekend is.
        options:
          format: yyyy-MM-dd
          min: "2027-10-24"
      - name: gofundmeUrl
        label: Link naar je GoFundMe
        type: string
        description: "Plak hier de link (https://www.gofundme.com/...). Zolang dit leeg is staat er 'Link volgt binnenkort'."
      - name: clubFormulierUrl
        label: Link naar aanmeldformulier Club van 100
        type: string
        description: "Het formulier waarmee mensen lid worden (bijv. Google Forms of Microsoft Forms). De knop 'Word lid' gaat hierheen. Zolang dit leeg is staat er 'Het aanmeldformulier volgt binnenkort!'."
      - name: schipVolgenUrl
        label: Link om het schip te volgen
        type: string
      - name: email
        label: E-mailadres (optioneel)
        type: string
        description: Wordt onderaan de site en bij zakelijke sponsoring getoond.
      - name: instagram
        label: Instagram-link (optioneel)
        type: string
        description: "Bijvoorbeeld https://www.instagram.com/maritatsea"
      - name: iban
        label: IBAN voor direct overmaken (optioneel)
        type: string
        description: Laat leeg als mensen alleen via GoFundMe doneren. Vul je dit in, dan verschijnt er een blok 'Direct overmaken' op de sponsorpagina.
      - name: tenaamstelling
        label: Ten name van (bij IBAN)
        type: string
      - name: omschrijving
        label: Omschrijving bij overboeking (bij IBAN)
        type: string
      - name: naam
        label: Je voornaam
        type: string
      - name: schip
        label: Naam van het schip
        type: string
      - name: organisatie
        label: Naam van de organisatie
        type: string
      - name: organisatieUrl
        label: Website van de organisatie
        type: string

  # ---------------------------------------------------------------
  - name: club
    label: 🪵 Club van 100 (leden)
    type: file
    path: src/data/club-van-100.json
    format: json
    fields:
      - name: leden
        label: Leden
        description: Iedere naam die je toevoegt komt op de sponsorpagina, en er gaat een patrijspoort "aan".
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{naam}"
        fields:
          - name: naam
            label: Naam
            type: string
            required: true
            description: Namen worden in beide talen precies zo getoond als je ze hier invult (ze worden niet vertaald).
          - name: url
            label: Link (optioneel)
            type: string
            description: "Bijvoorbeeld een website of LinkedIn. Laat leeg als er geen link is, dan staat alleen de naam er."

  # ---------------------------------------------------------------
  - name: sponsors
    label: 🤝 Sponsorlogo's (bedrijven)
    type: file
    path: src/data/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Sponsoren
        description: Bedrijven en organisaties die op de site komen. Sleep ze om de volgorde te veranderen.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{naam}"
        fields:
          - name: naam
            label: Naam
            type: string
            required: true
          - name: logo
            label: Logo
            type: image
            description: Het liefst een PNG met doorzichtige achtergrond.
            options:
              path: sponsors
          - name: url
            label: Website (optioneel)
            type: string
            description: "Bijvoorbeeld www.bedrijf.nl. Laat leeg als het bedrijf geen website heeft, dan is het logo gewoon niet klikbaar."

  # ---------------------------------------------------------------
  - name: home
    label: "🇳🇱 Pagina: Mijn droom (home)"
    type: file
    path: src/data/nl/home.json
    format: json
    fields: &velden_home
      - name: heroLabel
        label: "Bovenaan: klein label"
        type: string
        description: Het kleine witte labeltje boven de titel. Mag leeg.
      - name: heroTitel
        label: "Bovenaan: titel"
        type: string
      - name: heroLead
        label: "Bovenaan: dikgedrukte zin"
        type: string
      - name: heroTekst
        label: "Bovenaan: tekst 'Mijn droom'"
        description: Houd dit kort (één alinea), dan blijft de bovenkant van de pagina overzichtelijk.
        type: rich-text
        options:
          format: html
          media: false
      - name: heroKnopSponsor
        label: "Bovenaan: tekst sponsorknop"
        type: string
      - name: heroKnopReis
        label: "Bovenaan: tekst knop naar de reis"
        type: string
      - name: cijfers
        label: Cijfers
        description: De grote cijfers onder de golven (bijv. 12.000 zeemijl).
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{getal} {label}"
        fields:
          - name: getal
            label: Getal
            type: string
          - name: label
            label: Omschrijving
            type: string
      - name: waaromTitel
        label: "Waarom: titel"
        type: string
      - name: waaromIntro
        label: "Waarom: inleiding"
        type: rich-text
        options:
          format: html
          media: false
      - name: waaromPunten
        label: "Waarom: redenen"
        description: De kaartjes met redenen. Toevoegen, verwijderen en verslepen kan allemaal.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tekst}"
        fields:
          - &icoon
            name: icoon
            label: Icoon
            type: select
            options:
              values:
                - { name: schip, label: "⛵ Schip" }
                - { name: stuur, label: "☸️ Stuurwiel" }
                - { name: kompas, label: "🧭 Kompas" }
                - { name: anker, label: "⚓ Anker" }
                - { name: golf, label: "🌊 Golven" }
                - { name: vlag, label: "🚩 Vlag" }
                - { name: wereld, label: "🌍 Wereldbol" }
                - { name: berg, label: "⛰️ Berg" }
                - { name: boek, label: "📖 Boek" }
                - { name: pan, label: "🍳 Pan" }
                - { name: megafoon, label: "📣 Megafoon" }
                - { name: vrienden, label: "👭 Vrienden" }
                - { name: hart, label: "💙 Hartje" }
          - name: tekst
            label: Tekst
            type: text
      - name: waaromAfsluiting
        label: "Waarom: afsluitende tekst"
        type: text
      - name: overKnop
        label: "Knop naar 'Over mij'"
        type: string
      - name: reisKnop
        label: "Knop naar 'De reis'"
        type: string
      - name: sponsorKnop
        label: "Knop naar 'Sponsor mij'"
        type: string
      - name: sponsorsTitel
        label: "Sponsorlogo's: titel"
        type: string
      - name: sponsorsTekst
        label: "Sponsorlogo's: tekst"
        type: text
      - name: nieuwsTitel
        label: "Laatste nieuws: titel"
        type: string
      - name: nieuwsSubtitel
        label: "Laatste nieuws: ondertitel"
        type: string
      - name: aftelTekst
        label: Tekst boven de aftelklok
        type: string
      - name: footerTekst
        label: Tekst onderaan de site
        type: string
      - name: nieuwsPaginaIntro
        label: Introductie nieuwspagina
        type: text


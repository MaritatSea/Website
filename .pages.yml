# Configuratie voor Pages CMS (https://app.pagescms.org)
# Hiermee kan de website zonder programmeerkennis bewerkt worden.

media:
  input: public/media
  output: /media

content:
  # ---------------------------------------------------------------
  - name: nieuws
    label: 📰 Nieuwsberichten
    type: collection
    path: src/content/nieuws
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, concept]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        description: Berichten worden op datum gesorteerd, de nieuwste staat bovenaan.
      - name: cover
        label: Omslagfoto
        type: image
        description: Grote foto bovenaan het bericht en op de nieuwskaart. Mag leeg blijven.
        options:
          path: nieuws
      - name: samenvatting
        label: Korte samenvatting
        type: text
        description: Eén of twee zinnen voor op de nieuwskaart. Laat je dit leeg, dan wordt het begin van je bericht gebruikt.
      - name: concept
        label: Concept (nog niet publiceren)
        type: boolean
        description: Zet dit aan als je nog niet klaar bent. Het bericht is dan niet zichtbaar op de website.
      - name: body
        label: Bericht
        type: rich-text
        options:
          format: html
          path: nieuws

  # ---------------------------------------------------------------
  - name: site
    label: 💶 Sponsorteller & instellingen
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: opgehaald
        label: Al opgehaald (€)
        type: number
        description: Pas dit aan als er geld binnenkomt. Het bootje in de voortgangsbalk vaart dan verder!
      - name: doelbedrag
        label: Doelbedrag (€)
        type: number
        description: Zet op 0 om de voortgangsbalk te verbergen.
      - name: vertrekdatum
        label: Vertrek (datum en tijd)
        type: date
        description: "Hier telt de klok op de homepagina naartoe. Nederlandse tijd. Tijdens de reis staat er 'Dag 12 op zee'."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: terugkomstdatum
        label: Terugkomstdatum (optioneel)
        type: date
        description: Na deze dag staat er 'Weer veilig thuis!' in plaats van 'Dag … op zee'.
        options:
          format: yyyy-MM-dd
      - name: aftelTekst
        label: Tekst boven de aftelklok
        type: string
      - name: gofundmeUrl
        label: Link naar je GoFundMe
        type: string
        description: "Plak hier de link (https://www.gofundme.com/...). Zolang dit leeg is staat er 'Link volgt binnenkort'."
      - name: schipVolgenUrl
        label: Link om het schip te volgen
        type: string
      - name: email
        label: E-mailadres (optioneel)
        type: string
        description: Wordt onderaan de site en bij zakelijke sponsoring getoond.
      - name: instagram
        label: Instagram-link (optioneel)
        type: string
        description: "Bijvoorbeeld https://www.instagram.com/maritatsea"
      - name: iban
        label: IBAN voor direct overmaken (optioneel)
        type: string
        description: Laat leeg als mensen alleen via GoFundMe doneren. Vul je dit in, dan verschijnt er een blok 'Direct overmaken' op de sponsorpagina.
      - name: tenaamstelling
        label: Ten name van (bij IBAN)
        type: string
      - name: omschrijving
        label: Omschrijving bij overboeking (bij IBAN)
        type: string
      - name: naam
        label: Je voornaam
        type: string
      - name: schip
        label: Naam van het schip
        type: string
      - name: organisatie
        label: Naam van de organisatie
        type: string
      - name: organisatieUrl
        label: Website van de organisatie
        type: string
      - name: footerTekst
        label: Tekst onderaan de site
        type: string
      - name: nieuwsPaginaIntro
        label: Introductie nieuwspagina
        type: text

  # ---------------------------------------------------------------
  - name: club
    label: 🪵 Club van 100 (leden)
    type: file
    path: src/data/club-van-100.json
    format: json
    fields:
      - name: leden
        label: Leden
        description: Iedere naam die je toevoegt komt op de sponsorpagina, en er gaat een patrijspoort "aan".
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{naam}"
        fields:
          - name: naam
            label: Naam
            type: string
            required: true

  # ---------------------------------------------------------------
  - name: sponsors
    label: 🤝 Sponsorlogo's (bedrijven)
    type: file
    path: src/data/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Sponsoren
        description: Bedrijven en organisaties die op de site komen. Sleep ze om de volgorde te veranderen.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{naam}"
        fields:
          - name: naam
            label: Naam
            type: string
            required: true
          - name: logo
            label: Logo
            type: image
            description: Het liefst een PNG met doorzichtige achtergrond.
            options:
              path: sponsors
          - name: url
            label: Website (optioneel)
            type: string
            description: "Bijvoorbeeld https://www.bedrijf.nl. Het logo wordt dan klikbaar."

  # ---------------------------------------------------------------
  - name: home
    label: "🏠 Pagina: Mijn droom (home)"
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: heroLabel
        label: "Bovenaan: klein label"
        type: string
        description: Het kleine witte labeltje boven de titel. Mag leeg.
      - name: heroTitel
        label: "Bovenaan: titel"
        type: string
      - name: heroLead
        label: "Bovenaan: dikgedrukte zin"
        type: string
      - name: heroTekst
        label: "Bovenaan: tekst 'Mijn droom'"
        description: Houd dit kort (één alinea), dan blijft de bovenkant van de pagina overzichtelijk.
        type: rich-text
        options:
          format: html
          media: false
      - name: heroKnopSponsor
        label: "Bovenaan: tekst sponsorknop"
        type: string
      - name: heroKnopReis
        label: "Bovenaan: tekst knop naar de reis"
        type: string
      - name: cijfers
        label: Cijfers
        description: De grote cijfers onder de golven (bijv. 12.000 zeemijl).
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{getal} {label}"
        fields:
          - name: getal
            label: Getal
            type: string
          - name: label
            label: Omschrijving
            type: string
      - name: waaromTitel
        label: "Waarom: titel"
        type: string
      - name: waaromIntro
        label: "Waarom: inleiding"
        type: rich-text
        options:
          format: html
          media: false
      - name: waaromPunten
        label: "Waarom: redenen"
        description: De kaartjes met redenen. Toevoegen, verwijderen en verslepen kan allemaal.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tekst}"
        fields:
          - &icoon
            name: icoon
            label: Icoon
            type: select
            options:
              values:
                - { name: schip, label: "⛵ Schip" }
                - { name: stuur, label: "☸️ Stuurwiel" }
                - { name: kompas, label: "🧭 Kompas" }
                - { name: anker, label: "⚓ Anker" }
                - { name: golf, label: "🌊 Golven" }
                - { name: vlag, label: "🚩 Vlag" }
                - { name: wereld, label: "🌍 Wereldbol" }
                - { name: berg, label: "⛰️ Berg" }
                - { name: boek, label: "📖 Boek" }
                - { name: pan, label: "🍳 Pan" }
                - { name: megafoon, label: "📣 Megafoon" }
                - { name: vrienden, label: "👭 Vrienden" }
                - { name: hart, label: "💙 Hartje" }
          - name: tekst
            label: Tekst
            type: text
      - name: waaromAfsluiting
        label: "Waarom: afsluitende tekst"
        type: text
      - name: overKnop
        label: "Knop naar 'Over mij'"
        type: string
      - name: reisKnop
        label: "Knop naar 'De reis'"
        type: string
      - name: sponsorKnop
        label: "Knop naar 'Sponsor mij'"
        type: string
      - name: sponsorsTitel
        label: "Sponsorlogo's: titel"
        type: string
      - name: sponsorsTekst
        label: "Sponsorlogo's: tekst"
        type: text
      - name: nieuwsTitel
        label: "Laatste nieuws: titel"
        type: string
      - name: nieuwsSubtitel
        label: "Laatste nieuws: ondertitel"
        type: string

  # ---------------------------------------------------------------
  - name: over
    label: "🙋‍♀️ Pagina: Over mij"
    type: file
    path: src/data/over-mij.json
    format: json
    fields:
      - name: titel
        label: Titel
        type: string
      - name: samenvatting
        label: Korte tekst op de homepagina
        type: text
      - name: foto
        label: Foto
        type: image
        description: Staat op de homepagina én op de pagina 'Over mij'. Een staande foto werkt het best.
      - name: intro
        label: Introductie (bovenaan de pagina)
        type: text
      - name: weetjes
        label: Weetjes
        description: De kleine labeltjes met een emoji.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{emoji} {tekst}"
        fields:
          - name: emoji
            label: Emoji
            type: string
          - name: tekst
            label: Tekst
            type: string
      - name: tekst
        label: Tekst van de pagina
        type: rich-text
        options:
          format: html

  # ---------------------------------------------------------------
  - name: reis
    label: "🗺️ Pagina: De reis"
    type: file
    path: src/data/de-reis.json
    format: json
    fields:
      - name: titel
        label: Titel
        type: string
      - name: intro
        label: Introductie
        description: Staat bovenaan de pagina én op de homepagina.
        type: text
      - name: kaartVoetnoot
        label: Tekstje onder de routekaart
        type: text
      - name: onderdelen
        label: Onderdelen
        description: "Elk onderdeel (Expedities, School, …) krijgt een eigen blok op de pagina. De korte samenvatting staat op de homepagina."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titel}"
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - *icoon
          - name: samenvatting
            label: Korte samenvatting (homepagina)
            type: text
          - name: tekst
            label: Volledige tekst
            type: rich-text
            options:
              format: html
          - name: afbeelding
            label: Foto (optioneel)
            type: image
      - name: meerInfoTekst
        label: "Tekst bij 'Volg de reis' (onderaan)"
        type: text

  # ---------------------------------------------------------------
  - name: sponsorpagina
    label: "❤️ Pagina: Sponsor mij"
    type: file
    path: src/data/sponsor-mij.json
    format: json
    fields:
      - name: titel
        label: Titel
        type: string
      - name: intro
        label: Introductie
        description: Staat op de sponsorpagina én op de homepagina.
        type: rich-text
        options:
          format: html
          media: false
      - name: foto
        label: Foto
        type: image
        description: Staat naast de introductie (homepagina en sponsorpagina).
      - name: gofundmeTitel
        label: "GoFundMe: titel"
        type: string
      - name: gofundmeSamenvatting
        label: "GoFundMe: tekst"
        type: text
      - name: gofundmeKnop
        label: "GoFundMe: tekst op de knop"
        type: string
      - name: clubTitel
        label: "Club van 100: titel"
        type: string
      - name: clubSamenvatting
        label: "Club van 100: korte tekst (homepagina)"
        type: text
      - name: clubTekst
        label: "Club van 100: volledige tekst"
        type: rich-text
        options:
          format: html
          media: false
      - name: clubFoto
        label: "Club van 100: foto borrelplank"
        type: image
      - name: clubLedenTitel
        label: "Club van 100: titel boven de ledenlijst"
        type: string
      - name: zakelijkTitel
        label: "Zakelijk: titel"
        type: string
      - name: zakelijkSamenvatting
        label: "Zakelijk: korte tekst (homepagina)"
        type: text
      - name: zakelijkTekst
        label: "Zakelijk: tekst"
        type: rich-text
        options:
          format: html
          media: false
      - name: tegenprestaties
        label: "Zakelijk: tegenprestaties"
        description: De blokjes met vlaggetjes. Het aantal vlaggetjes loopt vanzelf op.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{bedrag}"
        fields:
          - name: bedrag
            label: Kopje (bijv. 'Vanaf € 1.000')
            type: string
          - name: tekst
            label: Tekst
            type: text
      - name: factuurTekst
        label: "Zakelijk: hoe werkt het (factuur)"
        type: rich-text
        options:
          format: html
          media: false
      - name: contactTekst
        label: "Zakelijk: oproep om contact op te nemen"
        type: string
      - name: bankTitel
        label: "Direct overmaken: titel"
        type: string
        description: Dit blok is alleen zichtbaar als er een IBAN is ingevuld bij de instellingen.
      - name: bankTekst
        label: "Direct overmaken: tekst"
        type: string
